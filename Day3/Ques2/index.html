<style>

    *{
    margin:0;
    padding:0;
    box-sizing: border-box;
    font-family: Roboto;
}
.container{
    width:100%;
    height:100%;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    margin:auto;
    padding:20px;
    gap:20px;
    
}
.child{
 
  background:white;
  display:flex;
  flex-direction:column;
  align-items: center;
  gap:5px;
  border-radius: 15px;
  box-shadow:0px 1px 8px #ccc;
}
.child .logo{
    width:100%;
    border-top-left-radius: 15px;
     border-top-right-radius: 15px;
}
h4{
    font-size: 1.2rem;
}

h2{
    font-weight: 100;
    font-size:1.2rem;
}
.logos{
    height:60px;
    width:150px;
    margin-bottom: 5px;
    
}


@media (max-width:600px){
.container{
     grid-template-columns: repeat(2,1fr);
}
}

@media((min-width:700px) and (max-width:1000px)){
   .container{
     grid-template-columns: repeat(3,1fr);
} 
}

</style>
