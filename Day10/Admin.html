<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
        width:80%;
        grid-template-columns: repeat(4,1fr);
        grid-template-rows: repeat(auto,1fr);
        margin:auto;
        gap:20px;
        margin-top:20px;
    }
    .card{
        background-color:white;
        box-shadow : 6px 6px 10px rgba(0, 0.1, 0,0.1);
        text-align: center;
    }
    .imgg{
        width:100%;
    }
    .main{
        width:85%;
        margin:auto;
        gap:10px;
    }
    input{
        height:30px;
        background-color:white;
        border: 1px solid black;
        border-radius: 8px;
        padding: 2px 4px;
        width:250px;
    }
    select{
        height:30px;
        background-color:white;
        border: 1px solid black;
          border-radius: 8px;
    }
    .head{
        display:flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom:20px;
    }
    .head button{
         height:40px;
         width:150px;
          border:  none;
          border-radius: 8px;
          background-color: royalblue;
          color:white;
    }
    button{
      height:40px;
         width:150px;  
           background-color:rgb(45, 194, 8);
           border:none;
           border-radius: 8px;
           color:white
    }
</style>
<body>
    <div class="main">
        <div class="head">
    <h1>Book Management App</h1>
    <input type="text" placeholder="Search Anything" id="Search" />
    <button type="button" onclick="window.location.href='index.html'">Go Back</button>
</div>
    
        <input id="title" type="text" placeholder="Enter Title"/>
        <input id="Author" type="text" placeholder="Enter Author"/>
        <select name="list" id="filter">
            <option value="All">All</option>
            <option value="Fiction">Fiction</option>
            <option value="Comedy">Comedy</option>
            <option value="Technical">Technical</option>
        </select>

        <button onclick="createBook()">Add Book</button>
        <button onclick="sortA2Z()">Sort by Title A → Z  </button>
        <button onclick="sortZ2A()">Sort by Title Z → A</button>
          <select name="list" onchange="filter()"id="category">
            <option value="All">All</option>
            <option value="Fiction">Fiction</option>
            <option value="Comedy">Comedy</option>
            <option value="Technical">Technical</option>
        </select>
        </div>
    <div class="container"></div>
    
</body>
 <script>
    let books=[];
    const image="https://m.media-amazon.com/images/I/71ZB18P3inL._SY522_.jpg";

     function createBook(){
       let title= document.getElementById("title").value;
       let author= document.getElementById("Author").value;
       let category = document.getElementById("filter").value;
        let book={
            title,
            author,
            category,
            image,
        }
        books.push(book);
        renderBooks(books);
        document.getElementById("title").value="";
        document.getElementById("Author").value="";
     }   
     function renderBooks(books){
        
           const container = document.querySelector(".container");
        container.innerHTML = "";
        books.forEach((book)=>{
          const card = document.createElement("div");
          card.className="card";
          const title = document.createElement("h3");
          title.textContent=`Title: ${book.title}`;

          const author=document.createElement("h3");
          author.textContent=`Author: ${book.author}`;

          const category = document.createElement("h3");
          category.textContent=`Category: ${book.category}`;
         
          const btn = document.createElement("button");
          btn.textContent="delete";
          btn.style.background="red";
          btn.addEventListener("click",()=>{
            card.remove();
          })
          const image = document.createElement("img");
          image.className="imgg";
          image.src=book.image;
          image.height="200"
          card.append(image,title,author,category,btn);
          
       
          container.append(card);

        })
     }

       function sortA2Z(){
           books.sort((a,b)=> a.title.localeCompare(b.title));
           renderBooks(books);
        }

         function sortZ2A(){
           books.sort((a,b)=> b.title.localeCompare(a.title));
             renderBooks(books);
        } 

        function filter(){
           let category = document.getElementById("category").value;
           if(category==="All"){
              renderBooks(books);
              return ;
           } 
           const filteredBooks = books.filter((book)=>{
            if(book.category === category){
                return book;
            }
           })
           console.log(filteredBooks)
           renderBooks(filteredBooks);
        }



        function filterData(searchText) {
  const result = books.filter(user =>
    user.title.toLowerCase().includes(searchText.toLowerCase())
  );

  renderBooks(result);
}

document.querySelector("#Search").addEventListener("input", (e) => {
  filterData(e.target.value);
});


    function reset(){
        window.location.href="index.html";
    }
</script>

</html>
